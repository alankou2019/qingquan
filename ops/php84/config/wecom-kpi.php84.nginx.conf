server {
    listen 80;
    server_name wecom-kpi.dacangcons.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/dingding/wecom-php84-staging;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server
{
    listen 443 ssl http2;
    server_name wecom-kpi.dacangcons.cn;
    index index.php index.html index.htm;
    root /www/wwwroot/dingding/wecom-php84-staging;

    ssl_certificate /www/server/panel/vhost/letsencrypt/wecom-kpi.dacangcons.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/wecom-kpi.dacangcons.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WECOMSSL:10m;
    ssl_session_timeout 10m;

    add_header X-Wecom-Runtime "php84-staging" always;

    include /www/server/panel/vhost/nginx/extension/wecom-kpi.dacangcons.cn/*.conf;

    location / {
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?_url=/$1 last;
        }
    }

    location ^~ /wecom/ {
        auth_basic off;
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?_url=/$1 last;
        }
    }

    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9084;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;
    }

    location ^~ /app/ { return 404; }
    location ^~ /var/ { return 404; }
    location ^~ /tools/ { return 404; }
    location ^~ /docs/ { return 404; }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        access_log off;
    }

    location ~ .*\.(js|css)?$ {
        expires 1h;
        access_log off;
    }

    access_log /www/wwwlogs/wecom-kpi.dacangcons.cn.log;
    error_log /www/wwwlogs/wecom-kpi.dacangcons.cn.error.log;
}
